serenity {
  project.name = "La Botica del Alquimista - Serenity BDD"
  take.screenshots = FOR_FAILURES      # FOR_EACH_ACTION solo para depurar: vuelve lenta la suite
  restart.browser.for.each = scenario  # navegador (y localStorage) limpio en cada escenario
}

screenplay.pronouns = "él,ella,ellos,ellas,su,sus"

# Ejecutar con -Dheadless.mode=false para ver el navegador
headless.mode = true

webdriver {
  driver = chrome
  timeouts {
    implicitlywait = 5000
    fluentwait = 15000
  }
  wait.for.timeout = 15000
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--window-size=1920,1080", "--no-sandbox", "--disable-dev-shm-usage", "--lang=es"]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://boticaalquimista.onrender.com"
  }
}
