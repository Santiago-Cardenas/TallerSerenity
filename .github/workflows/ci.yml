name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag o expresión de Cucumber (ej: @Issue-3, @HU-05, "@smoke or @negativo"). Vacío = toda la suite'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  serenity-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Ejecutar pruebas Serenity BDD
        id: tests
        continue-on-error: true
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          chmod +x gradlew
          if [ -n "$TAG" ]; then
            # Un tag simple sin @ (ej: Issue-3) se convierte en @Issue-3
            if echo "$TAG" | grep -Eq '^[A-Za-z0-9_-]+$'; then TAG="@$TAG"; fi
            echo "Ejecutando escenarios con la expresión: $TAG"
            ./gradlew clean test --no-daemon "-Dcucumber.filter.tags=$TAG"
          else
            echo "Ejecutando toda la suite"
            ./gradlew clean test --no-daemon
          fi

      - name: Publicar reporte de Serenity (Documentación Viva)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: |
            target/site/serenity/
            target/cucumber-reports/
          if-no-files-found: warn

      - name: Actualizar Issues vinculados (@Issue-N)
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'target/cucumber-reports';
            if (!fs.existsSync(dir)) {
              core.warning('No se encontró la carpeta de reportes de Cucumber');
              return;
            }

            // 1. Leer el JSON de Cucumber generado por el runner (plugin json:target/cucumber-reports/cucumber.json)
            const porIssue = {};
            for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.json'))) {
              let features;
              try { features = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8')); } catch (e) { continue; }
              if (!Array.isArray(features)) continue;

              for (const feature of features) {
                let backgroundOk = true;
                for (const el of feature.elements || []) {
                  const pasos = [...(el.before || []), ...(el.steps || []), ...(el.after || [])];
                  const ok = pasos.every(s => !s.result || ['passed', 'skipped'].includes(s.result.status));
                  if (el.type === 'background') { backgroundOk = ok; continue; }

                  const tags = (el.tags || []).map(t => t.name);
                  for (const tag of tags) {
                    const m = /^@Issue-(\d+)$/i.exec(tag);
                    if (!m) continue;
                    const n = Number(m[1]);
                    porIssue[n] = porIssue[n] || { passed: 0, failed: 0, escenarios: [], requisitos: new Set(), feature: feature.uri };
                    const paso = ok && backgroundOk;
                    porIssue[n][paso ? 'passed' : 'failed']++;
                    porIssue[n].escenarios.push(`${paso ? '✅' : '❌'} ${el.name}`);
                    tags.filter(t => /^@HU-/i.test(t)).forEach(t => porIssue[n].requisitos.add(t));
                  }
                }
              }
            }

            const issues = Object.keys(porIssue).map(Number).sort((a, b) => a - b);
            if (issues.length === 0) {
              core.warning('Ningún escenario ejecutado tiene un tag @Issue-N');
              return;
            }

            // 2. Comentar cada Issue y actualizar sus etiquetas de estado
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tagEjecutado = context.payload.inputs && context.payload.inputs.tag ? context.payload.inputs.tag : 'toda la suite';

            for (const n of issues) {
              const r = porIssue[n];
              const estado = r.failed > 0 ? 'FAILED' : 'PASSED';
              const agregar = estado === 'PASSED' ? 'status:passed' : 'status:failed';
              const quitar = estado === 'PASSED' ? 'status:failed' : 'status:passed';

              const body = [
                `## Resultado de la automatización: ${estado === 'PASSED' ? '✅ PASSED' : '❌ FAILED'}`,
                '',
                `- **Tag Serenity/Cucumber:** \`@Issue-${n}\``,
                `- **Historia de usuario:** ${[...r.requisitos].map(t => '`' + t + '`').join(', ') || 'N/A'}`,
                `- **Feature:** \`${r.feature}\``,
                `- **Ejecuciones:** ${r.passed} aprobadas / ${r.failed} fallidas`,
                `- **Ejecución solicitada:** ${tagEjecutado}`,
                `- **Pipeline (reporte serenity-report en Artifacts):** ${runUrl}`,
                '',
                '### Escenarios ejecutados',
                ...r.escenarios.map(e => `- ${e}`)
              ].join('\n');

              try {
                await github.rest.issues.createComment({ ...context.repo, issue_number: n, body });
                await github.rest.issues.addLabels({ ...context.repo, issue_number: n, labels: [agregar] });
                try {
                  await github.rest.issues.removeLabel({ ...context.repo, issue_number: n, name: quitar });
                } catch (e) { /* la etiqueta no estaba asignada */ }
                if (estado === 'FAILED') {
                  await github.rest.issues.addLabels({ ...context.repo, issue_number: n, labels: ['bug'] });
                }
                core.info(`Issue #${n}: ${estado}`);
              } catch (e) {
                core.warning(`No fue posible actualizar el Issue #${n}: ${e.message}`);
              }
            }

      - name: Marcar el pipeline como fallido si hubo escenarios fallidos
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Hay escenarios de Serenity fallidos. Revise el artefacto serenity-report."
          exit 1
